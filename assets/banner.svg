        <text x="72" y="25" text-anchor="middle" fill="#9EDCFF" font-size="15" font-weight="600">AMD + NVIDIA</text>
      </g>
      <g transform="translate(618 280)">
        <rect width="132" height="38" rx="19" fill="#0E2A44" stroke="#2E82B3" stroke-opacity="0.5"/>
        <text x="66" y="25" text-anchor="middle" fill="#9EDCFF" font-size="15" font-weight="600">PowerShell</text>
      </g>
      <g transform="translate(762 280)">
        <rect width="108" height="38" rx="19" fill="#0E2A44" stroke="#2E82B3" stroke-opacity="0.5"/>
        <text x="54" y="25" text-anchor="middle" fill="#9EDCFF" font-size="15" font-weight="600">MIT</text>
      </g>
