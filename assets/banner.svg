        <circle cx="154" cy="36" r="3.5"/>
        <circle cx="18" cy="136" r="3.5"/>
        <circle cx="154" cy="136" r="3.5"/>
      </g>
      <g fill="none" stroke="#3B9DD0" stroke-width="4" stroke-linecap="round" opacity="0.5">
        <path d="M57 52V42M72 52V42M87 52V42M102 52V42M117 52V42"/>
        <path d="M57 120V130M72 120V130M87 120V130M102 120V130M117 120V130"/>
        <path d="M52 57H42M52 72H42M52 87H42M52 102H42M52 117H42"/>
        <path d="M120 57H130M120 72H130M120 87H130M120 102H130M120 117H130"/>
      </g>
