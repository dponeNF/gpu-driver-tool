<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">GPU Driver Tool — поиск и установка драйверов AMD и NVIDIA</title>
  <desc id="desc">Баннер проекта: автоматический поиск официальных драйверов видеокарт для Windows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050D18"/>
      <stop offset="0.48" stop-color="#081C30"/>
      <stop offset="1" stop-color="#0B2945"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(170 160) rotate(90) scale(340 430)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#168ED8" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#168ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1120 70) rotate(130) scale(380 430)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2D7FF9" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2D7FF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="82" y1="88" x2="246" y2="258" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B2741"/>
      <stop offset="1" stop-color="#0A1B2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="133" y1="133" x2="198" y2="213" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#65E6FF"/>
      <stop offset="0.48" stop-color="#32B9F8"/>
      <stop offset="1" stop-color="#2D7FF9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#37C6FF"/>
      <stop offset="0.6" stop-color="#2D7FF9"/>
      <stop offset="1" stop-color="#5FE3FF"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="24"/>
    </clipPath>
  </defs>

