      <path d="M86 66V92M86 92L72 78M86 92L100 78" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M64 110H108" stroke="#65E6FF" stroke-width="6" stroke-linecap="round"/>
