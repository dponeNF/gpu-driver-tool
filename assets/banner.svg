    <g font-family="'Segoe UI', 'Arial', sans-serif">
      <text x="286" y="103" fill="#57D8FF" font-size="15" font-weight="600" letter-spacing="3.2">АВТОМАТИЧЕСКАЯ УСТАНОВКА ДРАЙВЕРОВ</text>
      <text x="282" y="174" fill="#F4FAFF" font-size="66" font-weight="700" letter-spacing="-2.2">GPU Driver Tool</text>
      <text x="286" y="216" fill="#BFD6E8" font-size="25" font-weight="400">Официальные драйверы AMD и NVIDIA — в два клика</text>
      <text x="286" y="248" fill="#7FA0BA" font-size="18" font-weight="400">Определение видеокарты, загрузка и запуск установщика для Windows 10 / 11</text>

      <g transform="translate(286 280)">
