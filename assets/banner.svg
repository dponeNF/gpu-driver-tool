      <path d="M62 0V-20M96 0V-20M130 0V-20M164 0V-20M62 214V234M96 214V234M130 214V234M164 214V234M0 62H-20M0 96H-20M0 130H-20M0 164H-20M214 62H234M214 96H234M214 130H234M214 164H234" stroke-width="6" stroke-linecap="round"/>
    </g>

