    <g fill="none" stroke="#4ABCE8" stroke-width="2" stroke-linecap="round" opacity="0.23">
      <path d="M1000 36H1106V76H1188"/>
      <path d="M1018 324H1094V292H1210"/>
      <path d="M1208 200H1138V164H1072"/>
